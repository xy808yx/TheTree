<script type="text/plain" data-tt-mod="app/views/map.js">
// Map: where the family lived and moved. A self-contained SVG world (vendored
// Natural Earth outline — no tiles, no network) onto which we plot every place
// that has stored coordinates, and draw a gentle arc for each person's journey
// from birthplace to where they died. Coordinates are filled in on entry via the
// offline gazetteer (see geo.js / edit.js); nothing here touches the network.

import { el, clear } from '@@MOD:app/dom.js@@';
import { store, displayName, lifespan } from '@@MOD:app/store.js@@';
import { LAND } from '@@MOD:app/vendor/worldmap.js@@';

// Equirectangular projection — the SVG viewBox is fixed at 2:1; the rendered
// size is driven by the wrap's actual width so the world map always fits its
// container at 100% zoom (no horizontal scrollbar). The user can zoom in past
// 100% and scroll to pan; at 100% the whole world is visible at once.
const W = 1280, H = 640;
const SVG = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const c of kids) if (c != null) n.append(c);
  return n;
}
const projX = (lng) => ((+lng + 180) / 360) * W;
const projY = (lat) => ((90 - +lat) / 180) * H;
const hasCoord = (d) => d && isFinite(+d.lat) && isFinite(+d.lng);

function gather() {
  const places = new Map(); // "lat,lng" -> { lat, lng, name, born:[], died:[] }
  const journeys = [];      // { person, from:{lat,lng}, to:{lat,lng} }
  const unlocated = [];
  const place = (coord, name, person, kind) => {
    const key = `${(+coord.lat).toFixed(3)},${(+coord.lng).toFixed(3)}`;
    let p = places.get(key);
    if (!p) places.set(key, (p = { lat: +coord.lat, lng: +coord.lng, name: name || '', born: [], died: [] }));
    if (name && !p.name) p.name = name;
    (kind === 'died' ? p.died : p.born).push(person);
  };
  for (const person of store.allPeople()) {
    const b = person.data.birth, d = person.data.death;
    const bc = hasCoord(b), dc = hasCoord(d);
    if (bc) place(b, b.place, person, 'born');
    if (dc) place(d, d.place, person, 'died');
    if (bc && dc && (Math.abs(b.lat - d.lat) > 0.05 || Math.abs(b.lng - d.lng) > 0.05)) {
      journeys.push({ person, from: { lat: +b.lat, lng: +b.lng, name: b.place || '' }, to: { lat: +d.lat, lng: +d.lng, name: d.place || '' } });
    }
    if (!bc && !dc) unlocated.push(person);
  }
  return { places: [...places.values()], journeys, unlocated };
}

function arcPath(from, to) {
  const x1 = projX(from.lng), y1 = projY(from.lat), x2 = projX(to.lng), y2 = projY(to.lat);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  // bow the curve perpendicular to the line, scaled gently with distance
  const off = Math.min(120, len * 0.18);
  const cx = mx + (-dy / len) * off, cy = my + (dx / len) * off;
  return `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}

function landPath() {
  let d = '';
  for (const poly of LAND) {
    for (const ring of poly) {
      if (ring.length < 2) continue;
      d += 'M' + ring.map(([lng, lat]) => `${projX(lng).toFixed(1)} ${projY(lat).toFixed(1)}`).join(' L ') + ' Z ';
    }
  }
  return d;
}

export function renderMap(view) {
  clear(view);
  const { places, journeys, unlocated } = gather();

  const wrap = el('section', { class: 'map' },
    el('h1', { class: 'page-title' }, 'Map'),
    el('p', { class: 'page-intro' }, 'Where the family came from and where they went. Each line is a life’s journey from birthplace to the place they died.'));

  if (!places.length) {
    wrap.append(el('p', { class: 'empty-note' },
      'No places located yet. Add a birthplace or place of death to someone, and the editor will look up its coordinates offline and pin it here.'));
    if (unlocated.length) wrap.append(el('p', { class: 'page-intro', style: { marginTop: '.5rem' } }, `${unlocated.length} ${unlocated.length === 1 ? 'person has' : 'people have'} a place recorded but no coordinates yet.`));
    view.append(wrap);
    return;
  }

  // ---- build the SVG ----
  let scale = 1;
  // The SVG sizes to its parent (.map-canvas) via CSS; the viewBox preserves
  // the coordinate space, so every projX/projY result remains valid regardless
  // of the rendered size.
  const svg = s('svg', { class: 'map-svg', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet' });
  svg.append(s('rect', { x: 0, y: 0, width: W, height: H, class: 'map-ocean' }));
  svg.append(s('path', { d: landPath(), class: 'map-land', 'fill-rule': 'evenodd' }));

  const arcLayer = s('g', { class: 'map-arcs' });
  journeys.forEach((j, i) => arcLayer.append(s('path', {
    d: arcPath(j.from, j.to), class: 'map-arc',
    pathLength: 1,                            // lets the CSS draw-in animate every arc the same way
    style: `animation-delay: ${120 + i * 110}ms`, // journeys appear one after another
  }, s('title', {}, `${displayName(j.person)}: ${j.from.name || 'birthplace'} → ${j.to.name || 'death'}`))));
  svg.append(arcLayer);

  const detail = el('aside', { class: 'map-side' });
  const showPlace = (pl) => {
    clear(detail);
    detail.append(el('h3', { class: 'section-title' }, pl.name || 'This place'));
    const list = (title, people) => people.length ? el('div', { class: 'map-side-group' },
      el('h4', {}, title),
      el('div', { class: 'person-chips' }, people.map((p) => el('a', { class: 'person-link', href: `#/person/${p.id}` },
        displayName(p), lifespan(p) ? el('span', { class: 'pl-life' }, lifespan(p)) : null)))) : null;
    detail.append(list('Born here', pl.born), list('Died here', pl.died));
  };

  const dots = s('g', { class: 'map-dots' });
  for (const pl of places) {
    const n = pl.born.length + pl.died.length;
    const r = 4 + Math.min(9, Math.sqrt(n) * 2.2);
    const cx = projX(pl.lng), cy = projY(pl.lat);
    const dot = s('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: r.toFixed(1), class: 'map-dot', tabindex: '0', role: 'button' },
      s('title', {}, `${pl.name || 'Place'} · ${n} ${n === 1 ? 'person' : 'people'}`));
    dot.addEventListener('click', () => { showPlace(pl); highlight(cx, cy); });
    dot.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPlace(pl); highlight(cx, cy); } });
    dots.append(dot);
  }
  const ring = s('circle', { r: 0, class: 'map-dot-ring' });
  dots.append(ring);
  function highlight(cx, cy) { ring.setAttribute('cx', cx.toFixed(1)); ring.setAttribute('cy', cy.toFixed(1)); ring.setAttribute('r', 16); }
  svg.append(dots);

  // The canvas div drives the rendered size. At scale = 1 it matches the wrap
  // width exactly (no scrollbars). When the user zooms in, it grows past the
  // wrap and the wrap's overflow:auto provides natural pan-by-scroll.
  const canvas = el('div', { class: 'map-canvas' }, svg);
  const mapWrap = el('div', { class: 'map-wrap' }, canvas);
  const zoomLabel = el('span', { class: 'tree-zoom-label', title: 'Zoom' }, '100%');
  // 100% means the canvas fits within the wrap on both axes (no scrollbars).
  // The wrap CSS aims for a 2:1 aspect, but max-height (or unusual viewports)
  // may make it wider-than-2:1; we always pick the largest 2:1 rectangle that
  // fits, so the map is never cropped at 100%.
  const fitWidth = () => {
    const cw = Math.max(120, mapWrap.clientWidth);
    const ch = Math.max(60, mapWrap.clientHeight);
    return Math.floor(Math.min(cw, ch * 2));
  };
  const setScale = (z) => {
    scale = Math.min(4, Math.max(1, z));   // never below 100% — the whole world stays visible by default
    const w = fitWidth() * scale;
    canvas.style.width = w + 'px';
    canvas.style.height = (w / 2) + 'px';   // equirectangular: height = width / 2
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  };

  const zoomGroup = el('div', { class: 'btn-group', role: 'group', 'aria-label': 'Zoom' },
    el('button', { class: 'btn btn-small', title: 'Zoom out', 'aria-label': 'Zoom out', onclick: () => setScale(scale - 0.3) }, '−'),
    zoomLabel,
    el('button', { class: 'btn btn-small', title: 'Reset zoom (fit to window)', onclick: () => setScale(1) }, 'Fit'),
    el('button', { class: 'btn btn-small', title: 'Zoom in', 'aria-label': 'Zoom in', onclick: () => setScale(scale + 0.3) }, '+'));

  const toolbar = el('div', { class: 'map-toolbar' },
    el('span', { class: 'tree-crumb' }, `${places.length} ${places.length === 1 ? 'place' : 'places'} · ${journeys.length} ${journeys.length === 1 ? 'journey' : 'journeys'}`),
    el('span', { class: 'toolbar-spacer' }),
    zoomGroup);

  // default side content: the journeys, read as a list
  clear(detail);
  detail.append(el('h3', { class: 'section-title' }, journeys.length ? 'Journeys' : 'Places'));
  if (journeys.length) {
    const jl = el('ul', { class: 'journey-list' });
    for (const j of journeys.sort((a, b) => displayName(a.person).localeCompare(displayName(b.person)))) {
      jl.append(el('li', {},
        el('a', { class: 'tl-person', href: `#/person/${j.person.id}` }, displayName(j.person)),
        el('span', { class: 'journey-route' }, `${j.from.name || 'unknown'} → ${j.to.name || 'unknown'}`)));
    }
    detail.append(jl);
  } else {
    detail.append(el('p', { class: 'page-intro' }, 'Select a marker to see who lived there.'));
  }

  const legend = el('div', { class: 'map-legend' },
    el('span', { class: 'map-legend-item' }, el('span', { class: 'map-legend-swatch' }), 'A place lived'),
    el('span', { class: 'map-legend-item' }, el('span', { class: 'map-legend-swatch', style: { transform: 'scale(1.6)' } }), 'Larger = more people'),
    el('span', { class: 'map-legend-item' }, el('span', { class: 'map-legend-swatch arc' }), 'A life’s journey'),
  );

  wrap.append(toolbar, el('div', { class: 'map-layout' }, mapWrap, detail), legend);

  if (unlocated.length) {
    wrap.append(el('p', { class: 'map-unlocated' },
      `${unlocated.length} ${unlocated.length === 1 ? 'person is' : 'people are'} not on the map yet. No place coordinates recorded.`));
  }

  view.append(wrap);

  // First fit: the wrap is connected, so reading clientWidth forces layout —
  // size synchronously (rAF can stall in hidden tabs).
  setScale(scale);

  // Window resize: re-fit the canvas to the new wrap width. ResizeObserver
  // catches both window resizes and sidebar layout changes (e.g. the 760px
  // breakpoint stacking the side panel below the map).
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => setScale(scale));
    ro.observe(mapWrap);
    // Stop observing once this view is replaced (cheap: poll the parent each tick).
    const stopWhenGone = () => {
      if (!mapWrap.isConnected) { ro.disconnect(); return; }
      requestAnimationFrame(stopWhenGone);
    };
    stopWhenGone();
  }
}

</script>
<script type="text/plain" data-tt-mod="app/views/person.js">
// Person profile: facts, story (markdown), tagged lessons as cards, photo
// gallery, and linked relationships.

import { el, clear } from '@@MOD:app/dom.js@@';
import { store, displayName, lifespan } from '@@MOD:app/store.js@@';
import { scanLessons, storyProse } from '@@MOD:app/parse.js@@';
import { marked } from '@@MOD:app/vendor/marked.esm.js@@';
import DOMPurify from '@@MOD:app/vendor/purify.es.js@@';

function mdBlock(text) {
  const div = el('div', { class: 'story' });
  if (text) div.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  return div;
}

function personLink(p, relation) {
  if (!p) return null;
  const life = lifespan(p);
  return el('a', { class: 'person-link', href: `#/person/${p.id}` },
    displayName(p),
    life ? el('span', { class: 'pl-life' }, life) : null,
    relation && relation !== 'biological' ? el('span', { class: `rel-badge ${relation}` }, relation) : null);
}

function group(title, links) {
  links = links.filter(Boolean);
  if (!links.length) return null;
  return el('div', { class: 'relation-group' },
    el('h4', {}, title),
    el('div', { class: 'person-chips' }, links));
}

function lifeLines(p) {
  const d = p.data;
  const lines = [];
  const born = p.birth.display || (d.birth && d.birth.place ? '' : null);
  if (p.birth.display || (d.birth && d.birth.place)) {
    lines.push(el('div', {}, p.birth.display ? `Born ${p.birth.display}` : 'Born',
      d.birth && d.birth.place ? el('span', { class: 'profile-place' }, ` · ${d.birth.place}`) : null));
  }
  if (p.death.display || (d.death && d.death.place)) {
    lines.push(el('div', {}, p.death.display ? `Died ${p.death.display}` : 'Died',
      d.death && d.death.place ? el('span', { class: 'profile-place' }, ` · ${d.death.place}`) : null));
  } else if (d.living === true && p.birth.known) {
    lines.push(el('div', {}, 'Living'));
  }
  return lines;
}

function tagPills(tags) {
  const out = [];
  for (const [cat, raw] of Object.entries(tags || {})) {
    const vals = Array.isArray(raw) ? raw : [raw];
    for (const v of vals) {
      out.push(el('span', { class: 'tag' }, el('span', { class: 'tag-cat' }, cat), String(v)));
    }
  }
  return out;
}

function fillPhotos(container, person) {
  const photos = person.data.photos || [];
  for (const ph of photos) {
    const cell = el('figure', { class: 'photo' });
    cell.append(ph.src
      ? el('img', { src: ph.src, alt: ph.caption || person.id, loading: 'lazy' })
      : el('div', { class: 'photo-missing' }, ph.caption || 'Photo'));
    if (ph.caption) cell.append(el('figcaption', { class: 'photo-cap' }, ph.caption + (ph.date ? ` · ${ph.date}` : '')));
    container.append(cell);
  }
}

export function renderPerson(view, id) {
  const p = store.getPerson(id);
  clear(view);
  if (!p) { view.append(el('p', { class: 'empty-note' }, 'No record for this person.')); return; }

  const aka = (p.data.names && p.data.names.also_known_as) || [];
  const wrap = el('article', { class: 'profile' });

  // the first photograph stands in as the portrait; a monogram bookplate otherwise
  const firstPhoto = (p.data.photos || []).find((ph) => ph.src);
  const portrait = firstPhoto
    ? el('img', { class: 'profile-portrait', src: firstPhoto.src, alt: firstPhoto.caption || displayName(p) })
    : el('div', { class: 'portrait-blank' }, monogram(p));
  const head = el('header', { class: 'profile-head' },
    portrait,
    el('div', {},
      el('h1', { class: 'profile-name' }, displayName(p),
        aka.length ? el('span', { class: 'profile-aka' }, ` · “${aka.join('”, “')}”`) : null),
      el('div', { class: 'profile-life' }, ...lifeLines(p)),
      el('div', { class: 'profile-actions' },
        el('a', { class: 'btn btn-small', href: `#/tree/${p.id}` }, 'View in tree'),
        el('button', { class: 'btn btn-small', onclick: () => editPerson(p) }, 'Edit')),
      Object.keys(p.data.tags || {}).length ? el('div', { class: 'tags' }, tagPills(p.data.tags)) : null));
  wrap.append(head);

  // photos
  if ((p.data.photos || []).length) {
    wrap.append(el('hr', { class: 'section-rule' }), el('h3', { class: 'section-title' }, 'Photographs'));
    const gallery = el('div', { class: 'gallery' });
    wrap.append(gallery);
    fillPhotos(gallery, p);
  }

  // story
  const prose = storyProse(p.body);
  if (prose) {
    wrap.append(el('hr', { class: 'section-rule' }), el('h3', { class: 'section-title' }, 'Story'), mdBlock(prose));
  }

  // lessons — mistakes first, as everywhere (the via-negativa lens)
  const lessons = scanLessons(p.body).sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'mistake' ? -1 : 1));
  if (lessons.length) {
    wrap.append(el('hr', { class: 'section-rule' }), el('h3', { class: 'section-title' }, 'Lessons & Mistakes'));
    const list = el('ul', { class: 'lesson-list' });
    for (const l of lessons) {
      list.append(el('li', { class: 'lesson' + (l.kind === 'mistake' ? ' is-mistake' : '') },
        el('p', { class: 'lesson-text' }, l.text),
        el('div', { class: 'lesson-meta' },
          el('span', { class: 'lesson-kind' }, l.kind === 'mistake' ? 'Mistake' : 'Lesson'),
          el('span', { class: 'lesson-theme' }, l.theme))));
    }
    wrap.append(list);
  }

  // relationships
  const parents = store.parentsOf(p);
  const partners = store.partnersOf(p);
  const children = store.childrenOf(p);
  const siblings = store.siblingsOf(p);
  const rel = el('div', { class: 'relations' });
  const groups = [
    group('Parents', parents.map((x) => personLink(x.person, x.relation))),
    group('Spouses & partners', partners.map((x) => personLink(x.person, unionNote(x.union)))),
    group('Children', children.map((x) => personLink(x.person, x.relation))),
    group('Siblings', siblings.map((x) => personLink(x.person, x.relation))),
  ].filter(Boolean);
  if (groups.length) {
    wrap.append(el('hr', { class: 'section-rule' }), el('h3', { class: 'section-title' }, 'Family'));
    rel.append(...groups);
    wrap.append(rel);
  }

  view.append(wrap);
}

function unionNote(u) {
  if (!u) return null;
  const s = u.data.status;
  return s && s !== 'married' ? s : null;
}

function monogram(p) {
  const n = displayName(p).trim();
  const initials = n.split(/\s+/).map((w) => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  return initials || '?';
}

async function editPerson(p) {
  const { openPersonEditor } = await import(__TTURL('app/views/edit.js'));
  openPersonEditor({ person: p });
}

</script>
<script type="text/plain" data-tt-mod="app/views/query.js">
// People directory: search by name, or browse/filter by trait tags
// ("show everyone who…").

import { el, clear, go } from '@@MOD:app/dom.js@@';
import { store, displayName, lifespan } from '@@MOD:app/store.js@@';

export function renderQuery(view) {
  clear(view);
  const state = { query: '', tag: null };
  const tags = store.tagIndex();

  const results = el('div', { class: 'results' });
  const cloud = el('div', { class: 'tag-cloud' });

  function renderResults() {
    clear(results);
    let people;
    let caption;
    if (state.query) { people = store.search(state.query); caption = `Matches for “${state.query}”`; }
    else if (state.tag) {
      const found = tags.find((t) => `${t.category}::${t.value}` === state.tag);
      people = found ? [...found.people].sort((a, b) => displayName(a).localeCompare(displayName(b))) : [];
      caption = found ? `${found.category}: ${found.value}` : '';
    } else {
      people = store.allPeople().sort((a, b) => displayName(a).localeCompare(displayName(b)));
      caption = `All ${people.length} people`;
    }
    results.append(el('div', { class: 'results-caption' }, caption));
    if (!people.length) { results.append(el('p', { class: 'empty-note' }, 'No one matches.')); return; }
    for (const p of people) {
      results.append(el('a', { class: 'person-row', href: `#/person/${p.id}` },
        el('span', { class: 'pr-name' }, displayName(p)),
        el('span', { class: 'pr-life' }, lifespan(p))));
    }
  }

  function renderCloud() {
    clear(cloud);
    for (const t of tags) {
      const key = `${t.category}::${t.value}`;
      cloud.append(el('button', {
        class: 'tag-chip' + (state.tag === key ? ' is-active' : ''),
        onclick: () => { state.tag = state.tag === key ? null : key; state.query = ''; search.value = ''; renderCloud(); renderResults(); },
      }, el('span', { class: 'tc-cat' }, t.category), t.value, el('span', { class: 'tc-count' }, t.people.length)));
    }
  }

  const search = el('input', {
    class: 'searchbox', type: 'search', placeholder: 'Search people by name…', 'aria-label': 'Search people by name',
    oninput: (e) => { state.query = e.target.value.trim(); state.tag = null; renderCloud(); renderResults(); },
  });

  const wrap = el('section', { class: 'query' },
    el('h1', { class: 'page-title' }, 'People'),
    el('p', { class: 'page-intro' }, 'Search by name, or browse by trait: talents the family shared, or health threads to know about.'),
    search,
    tags.length ? el('p', { class: 'section-title', style: { marginTop: '1.25rem' } }, 'Browse by trait') : null,
    cloud,
    results);

  renderCloud();
  renderResults();
  view.append(wrap);
}

</script>
<script type="text/plain" data-tt-mod="app/views/timeline.js">
// Timeline: the family laid out across the years. Births, deaths, marriages and
// their endings become dated events (via parse.js sortKeys), sorted and grouped
// by decade so you can read the family forward through its eras. Dates that
// don't parse aren't dropped — they're listed, undated, at the end.

import { el, clear } from '@@MOD:app/dom.js@@';
import { store, displayName } from '@@MOD:app/store.js@@';

const TYPE_ORDER = { birth: 0, union: 1, 'union-end': 2, death: 3 };

function partners(u) {
  return (u.data.partners || []).map((id) => store.getPerson(id)).filter(Boolean);
}

function buildEvents() {
  const events = [];
  const undated = [];

  for (const p of store.allPeople()) {
    if (p.birth.known) {
      events.push({ sortKey: p.birth.sortKey, year: p.birth.year, when: p.birth.display, type: 'birth', people: [p], place: place(p.data.birth) });
    } else if (p.birth.raw) {
      undated.push({ type: 'birth', people: [p], raw: p.birth.raw });
    }
    if (p.death.known) {
      events.push({ sortKey: p.death.sortKey, year: p.death.year, when: p.death.display, type: 'death', people: [p], place: place(p.data.death) });
    } else if (p.death.raw && !p.death.living) {
      undated.push({ type: 'death', people: [p], raw: p.death.raw });
    }
  }

  for (const u of store.allUnions()) {
    const ppl = partners(u);
    if (!ppl.length) continue;
    if (u.start.known) {
      events.push({ sortKey: u.start.sortKey, year: u.start.year, when: u.start.display, type: 'union', utype: u.data.type, people: ppl });
    }
    // Only show an ending when it's a separation; a widowing already shows as a death.
    const status = u.data.status;
    if (u.end.known && (status === 'divorced' || status === 'separated' || status === 'ended')) {
      events.push({ sortKey: u.end.sortKey, year: u.end.year, when: u.end.display, type: 'union-end', status, people: ppl });
    }
  }

  events.sort((a, b) => a.sortKey - b.sortKey || (TYPE_ORDER[a.type] - TYPE_ORDER[b.type]));
  return { events, undated };
}

function place(d) { return (d && d.place) || ''; }

function peopleLinks(people) {
  const out = [];
  people.forEach((p, i) => {
    if (i) out.push(el('span', { class: 'tl-amp' }, people.length === 2 ? ' & ' : ', '));
    out.push(el('a', { class: 'tl-person', href: `#/person/${p.id}` }, displayName(p)));
  });
  return out;
}

function verb(ev) {
  if (ev.type === 'birth') return 'born';
  if (ev.type === 'death') return 'died';
  if (ev.type === 'union') {
    return ev.utype === 'partnership' ? 'began a partnership'
      : ev.utype === 'unmarried' ? 'together'
        : 'married';
  }
  if (ev.type === 'union-end') return ev.status === 'divorced' ? 'divorced' : ev.status === 'separated' ? 'separated' : 'parted';
  return '';
}

function eventRow(ev) {
  const fineWhen = ev.when && /\s/.test(ev.when) ? ev.when : null; // month/day precision worth showing in full
  return el('div', { class: `tl-event tl-${ev.type}`, title: fineWhen || undefined },
    el('div', { class: 'tl-year' }, String(ev.year)),
    el('div', { class: 'tl-rail' }, el('span', { class: 'tl-dot' })),
    el('div', { class: 'tl-body' },
      el('span', { class: 'tl-line' }, ...peopleLinks(ev.people), ' ', el('span', { class: 'tl-what' }, verb(ev))),
      ev.place ? el('span', { class: 'tl-place' }, ev.place) : null,
      fineWhen ? el('span', { class: 'tl-fine' }, fineWhen) : null));
}

export function renderTimeline(view) {
  clear(view);
  const { events, undated } = buildEvents();

  const wrap = el('section', { class: 'timeline' },
    el('h1', { class: 'page-title' }, 'Timeline'),
    el('p', { class: 'page-intro' },
      'The family read forward through the years: births, marriages, and partings, in the order they happened.'));

  if (!events.length) {
    wrap.append(el('p', { class: 'empty-note' }, 'No dated events yet. Add birth or death years to people, or dates to marriages, and they will appear here.'));
    view.append(wrap);
    return;
  }

  const first = events[0].year, last = events[events.length - 1].year;
  wrap.append(el('p', { class: 'tl-span' }, `${first}–${last} · ${events.length} events`));

  const track = el('div', { class: 'tl-track' });
  let currentDecade = null;
  for (const ev of events) {
    const decade = Math.floor(ev.year / 10) * 10;
    if (decade !== currentDecade) {
      currentDecade = decade;
      track.append(el('div', { class: 'tl-era' },
        el('div', { class: 'tl-year' }),
        el('div', { class: 'tl-rail' }, el('span', { class: 'tl-era-node' })),
        el('div', { class: 'tl-era-label' }, `${decade}s`)));
    }
    track.append(eventRow(ev));
  }
  wrap.append(track);

  if (undated.length) {
    const list = el('ul', { class: 'tl-undated-list' });
    for (const u of undated) {
      list.append(el('li', {},
        ...peopleLinks(u.people), ' ', el('span', { class: 'tl-what' }, u.type === 'birth' ? 'born' : 'died'),
        el('span', { class: 'tl-place' }, `“${u.raw}”`)));
    }
    wrap.append(
      el('h2', { class: 'tl-undated-title' }, 'Dates not yet placed'),
      el('p', { class: 'page-intro', style: { marginBottom: '.6rem' } }, 'Recorded, but without a year specific enough to position on the line.'),
      list);
  }

  view.append(wrap);
}

</script>
<script type="text/plain" data-tt-mod="app/views/tree.js">
// Focus-on-person tree. Descendants and ancestors are laid out as separate
// subtrees, both anchored on the focus (col 0); siblings (incl. half/step/
// adopted) sit left of the focus and spouses to the right. Every parent→child
// and spouse edge is then derived from the data, so half-siblings, step-parents
// and remarriages all connect correctly. HTML cards over an SVG edge layer.

import { el, clear, go } from '@@MOD:app/dom.js@@';
import { store, displayName, lifespan } from '@@MOD:app/store.js@@';

const NODE_W = 150, NODE_H = 64, COLSTEP = 178, ROWSTEP = 134, PAD = 48;
const MAX_UP = 3, MAX_DOWN = 2;

const SVG = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}

export function renderTree(view, focusId) {
  clear(view);
  const focus = store.getPerson(focusId);
  if (!focus) { view.append(el('p', { class: 'empty-note' }, 'No one to show yet.')); return; }

  const nodes = [];
  const byId = new Map();
  const seen = new Set();
  let cursor = 0;

  function add(person, gen, col, kind, relation) {
    const n = { person, gen, col, kind, relation: relation || null };
    nodes.push(n); byId.set(person.id, n); return n;
  }

  // ---- descendants (focus subtree) ----
  function layoutDesc(person, gen, relation) {
    if (seen.has(person.id)) return byId.get(person.id) ? byId.get(person.id).col : cursor;
    seen.add(person.id);
    const kids = gen < MAX_DOWN ? store.childrenOf(person).filter((c) => !seen.has(c.person.id)) : [];
    let col;
    if (!kids.length) { col = cursor; cursor += 1; }
    else {
      const cols = kids.map((c) => layoutDesc(c.person, gen + 1, c.relation));
      col = (cols[0] + cols[cols.length - 1]) / 2;
    }
    add(person, gen, col, gen === 0 ? 'focus' : 'desc', relation);
    return col;
  }
  layoutDesc(focus, 0, null);

  // normalize so focus sits at col 0
  const focusCol = byId.get(focus.id).col;
  for (const n of nodes) n.col -= focusCol;

  // ---- siblings (left) incl. half/step/adopted ----
  let leftCol = -1;
  for (const sib of allSiblings(focus)) {
    if (byId.has(sib.person.id)) continue;
    add(sib.person, 0, leftCol, 'sibling', sib.label);
    leftCol -= 1;
  }

  // ---- spouses (right) ----
  let rightCol = 1;
  for (const { person: sp } of store.partnersOf(focus)) {
    if (byId.has(sp.id)) continue;
    add(sp, 0, rightCol, 'spouse', null);
    rightCol += 1;
  }

  // ---- ancestors (pedigree), own cursor then aligned to focus ----
  let cursorA = 0;
  const anc = [];
  const ancSeen = new Map(); // personId -> col; breaks cycles / pedigree-collapse loops
  function layoutAnc(person, gen) {
    if (ancSeen.has(person.id)) return ancSeen.get(person.id); // already placed — never recurse a loop
    ancSeen.set(person.id, cursorA); // tentative slot so a cyclic ancestor resolves instead of hanging
    const parents = gen > -MAX_UP ? store.parentsOf(person).map((x) => x.person) : [];
    let col;
    if (!parents.length) { col = cursorA; cursorA += 1; }
    else { const cols = parents.map((p) => layoutAnc(p, gen - 1)); col = cols.reduce((a, b) => a + b, 0) / cols.length; }
    ancSeen.set(person.id, col);
    if (gen !== 0) anc.push({ person, gen, col });
    return col;
  }
  const focusAncCol = layoutAnc(focus, 0);
  for (const r of anc) if (!byId.has(r.person.id)) add(r.person, r.gen, r.col - focusAncCol, 'anc', ancRelation(r.person, focus));

  // ---- position to pixels ----
  const minCol = Math.min(...nodes.map((n) => n.col));
  const minGen = Math.min(...nodes.map((n) => n.gen));
  const maxCol = Math.max(...nodes.map((n) => n.col));
  const maxGen = Math.max(...nodes.map((n) => n.gen));
  for (const n of nodes) {
    n.px = PAD + (n.col - minCol) * COLSTEP;
    n.py = PAD + (n.gen - minGen) * ROWSTEP;
  }
  const width = PAD * 2 + (maxCol - minCol) * COLSTEP + NODE_W;
  const height = PAD * 2 + (maxGen - minGen) * ROWSTEP + NODE_H;

  // ---- edges (derived from data) ----
  const edges = [];
  for (const n of nodes) {
    for (const { person: par } of store.parentsOf(n.person)) {
      const pn = par && byId.get(par.id);
      if (pn) edges.push(elbow(n, pn));
    }
  }
  const drawnSpouse = new Set();
  for (const u of store.allUnions()) {
    const parts = (u.data.partners || []).map((id) => byId.get(id)).filter(Boolean);
    if (parts.length === 2) {
      const key = parts.map((p) => p.person.id).sort().join('|');
      if (!drawnSpouse.has(key)) { drawnSpouse.add(key); edges.push(spouseEdge(parts[0], parts[1])); }
    }
  }

  // ---- DOM ----
  let scale = 1;
  const canvas = el('div', { class: 'tree-canvas', style: { width: width + 'px', height: height + 'px' } });
  const svg = svgEl('svg', { class: 'tree-edges', width, height, viewBox: `0 0 ${width} ${height}` });
  for (const e of edges) svg.append(svgEl('path', { d: e.d, class: e.cls || '' }));
  canvas.append(svg);
  for (const n of nodes) canvas.append(card(n, focus.id));

  const wrap = el('div', { class: 'tree-wrap' }, canvas);

  const zoomLabel = el('span', { class: 'tree-zoom-label', title: 'Zoom' }, '100%');
  const setScale = (s) => {
    const next = Math.min(1.6, Math.max(0.4, s));
    // zoom about the centre of the current viewport, not the canvas corner
    const f = next / scale;
    const cx = wrap.scrollLeft + wrap.clientWidth / 2;
    const cy = wrap.scrollTop + wrap.clientHeight / 2;
    scale = next;
    canvas.style.transform = `scale(${scale})`;
    wrap.scrollLeft = cx * f - wrap.clientWidth / 2;
    wrap.scrollTop = cy * f - wrap.clientHeight / 2;
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  };
  const zoomGroup = el('div', { class: 'btn-group', role: 'group', 'aria-label': 'Zoom' },
    el('button', { class: 'btn btn-small', title: 'Zoom out', 'aria-label': 'Zoom out', onclick: () => setScale(scale - 0.15) }, '−'),
    zoomLabel,
    el('button', { class: 'btn btn-small', title: 'Reset zoom', onclick: () => setScale(1) }, 'Reset'),
    el('button', { class: 'btn btn-small', title: 'Zoom in', 'aria-label': 'Zoom in', onclick: () => setScale(scale + 0.15) }, '+'));

  const toolbar = el('div', { class: 'tree-toolbar' },
    el('span', { class: 'tree-crumb' }, 'Centered on ', el('strong', {}, displayName(focus)), '. Click any card to re-center.'),
    el('a', { class: 'btn btn-small', href: `#/person/${focus.id}` }, 'Open profile'),
    el('span', { class: 'toolbar-spacer' }),
    zoomGroup);

  const legend = el('div', { class: 'tree-legend' },
    el('span', { class: 'tree-legend-item' }, el('span', { class: 'tree-legend-swatch sex-F' }), 'Female'),
    el('span', { class: 'tree-legend-item' }, el('span', { class: 'tree-legend-swatch sex-M' }), 'Male'),
  );

  view.append(toolbar, wrap, legend);

  // Land with the focus card centred — on a phone (or a deep tree) it can
  // otherwise sit a full screen away from the first thing you see. The wrap is
  // already connected, so reading clientWidth forces layout and we can scroll
  // synchronously (rAF can stall in hidden tabs).
  const focusNode = byId.get(focus.id);
  wrap.scrollLeft = focusNode.px * scale + (NODE_W * scale) / 2 - wrap.clientWidth / 2;
  wrap.scrollTop = focusNode.py * scale + (NODE_H * scale) / 2 - wrap.clientHeight / 2;
}

function card(n, focusId) {
  const p = n.person;
  const sexClass = p.data.sex === 'F' ? ' sex-F' : p.data.sex === 'M' ? ' sex-M' : '';
  const isFocus = p.id === focusId;
  const c = el('div', {
    class: 'node-card' + sexClass + (isFocus ? ' is-focus' : ''),
    style: { left: n.px + 'px', top: n.py + 'px' },
    title: isFocus ? 'This is the focus. Click to open profile.' : `Click to center on ${displayName(p)}`,
    onclick: () => { if (isFocus) go(`#/person/${p.id}`); else go(`#/tree/${p.id}`); },
  },
    el('div', { class: 'node-name' }, displayName(p)),
    lifespan(p) ? el('div', { class: 'node-life' }, lifespan(p)) : null,
    n.relation && n.relation !== 'biological' ? el('div', { class: 'node-rel' }, n.relation) : null);
  return c;
}

function elbow(childNode, parentNode) {
  const cx = childNode.px + NODE_W / 2, ct = childNode.py;
  const px = parentNode.px + NODE_W / 2, pb = parentNode.py + NODE_H;
  const mid = (pb + ct) / 2;
  return { d: `M ${cx} ${ct} L ${cx} ${mid} L ${px} ${mid} L ${px} ${pb}` };
}

function spouseEdge(a, b) {
  const left = a.px <= b.px ? a : b, right = a.px <= b.px ? b : a;
  return { d: `M ${left.px + NODE_W} ${left.py + NODE_H / 2} L ${right.px} ${right.py + NODE_H / 2}`, cls: 'is-spouse' };
}

// Siblings across BOTH parents' unions; labels full(null)/adopted/step/half.
function allSiblings(focus) {
  const pu = store.parentsUnionOf(focus);
  if (!pu) return [];
  const parents = (pu.data.partners || []).map((id) => store.getPerson(id)).filter(Boolean);
  const out = new Map();
  for (const parent of parents) {
    for (const c of store.childrenOf(parent)) {
      if (c.person.id === focus.id || out.has(c.person.id)) continue;
      const samePU = c.person.data.parents_union === focus.data.parents_union;
      const label = samePU ? (c.relation !== 'biological' ? c.relation : null) : 'half';
      out.set(c.person.id, { person: c.person, label });
    }
  }
  return [...out.values()];
}

function ancRelation(person, focus) {
  // label a parent of the focus if the focus joined that union non-biologically
  const fpu = store.parentsUnionOf(focus);
  if (fpu && (fpu.data.partners || []).includes(person.id)) {
    const entry = (fpu.data.children || []).find((c) => c.person === focus.id);
    if (entry && entry.relation && entry.relation !== 'biological') return entry.relation;
  }
  return null;
}

</script>
<script type="text/plain" data-tt-mod="app/archive.js">
// Single-file storage layer. The whole archive — the app, the family data, and
// the (compressed) photos — lives in one family.html. This module reads the data
// embedded in the page, writes an updated self-contained copy of the page back to
// disk (in place via the File System Access API where available, or as a download
// everywhere else), and turns chosen photos into compressed data URIs so there is
// no media/ folder to carry around.
//
// Replaces the old folder-of-files layer (fsa.js). The in-memory `store` keeps its
// {kind, data, body} document shape, so every view and the editor are unchanged.

import { store } from '@@MOD:app/store.js@@';

// Where the editor is hosted — the one place a relative gets the app to open or
// start an archive. Shared with the in-app guide (views/guide.js) so it can't drift.
export const APP_URL = 'https://xy808yx.github.io/TheTree/';

const DATA_ID = 'archive-data';
const ARCHIVE_FILENAME = 'family.html';

// ---------- read the data embedded in this page ----------

// Escape "<" so a JSON payload can never contain the literal "@@ENDSCRIPT@@>" that would
// end the <script> tag early. JSON.parse turns < back into "<" on the way in.
function encodeData(docs) { return JSON.stringify(docs).replace(/</g, '\\u003c'); }

function parseDocsJSON(text) {
  const t = (text || '').trim();
  if (!t) return [];
  const docs = JSON.parse(t);
  return Array.isArray(docs) ? docs : [];
}

// Read the <script id="archive-data"> in THIS document → array of docs (or []).
export function loadEmbedded() {
  const el = document.getElementById(DATA_ID);
  if (!el) return [];
  try { return parseDocsJSON(el.textContent); }
  catch (e) { console.error('The Tree: embedded archive data could not be read', e); return []; }
}

// Pull the embedded data out of another family.html's text (used when opening or
// reconnecting to a file). Throws if the file isn't one of ours.
function extractDocsFromHTML(text) {
  const doc = new DOMParser().parseFromString(String(text || ''), 'text/html');
  const el = doc.getElementById(DATA_ID);
  if (!el) throw new Error('That file isn’t a family.html archive. No embedded family data was found in it.');
  return parseDocsJSON(el.textContent);
}

// The live store back to the embeddable doc array the views/editor produced.
export function currentDocs() {
  return [...store.allPeople(), ...store.allUnions()].map((r) => ({ kind: r.kind, data: r.data, body: r.body || '' }));
}

// ---------- build a fresh self-contained copy of this page ----------

// Clone the running document, blank the rendered UI and any transient overlays,
// and stamp in the current data — yielding a complete, openable family.html. The
// inlined styles, code modules and bootstrap ride along in the clone automatically,
// so the running page is its own template.
export function buildArchiveHTML(docs) {
  const html = document.documentElement.cloneNode(true);
  const appEl = html.querySelector('#app');
  if (appEl) appEl.replaceChildren();
  html.querySelectorAll('.toast-stack, .modal-backdrop').forEach((n) => n.remove());
  const dataEl = html.querySelector('#' + DATA_ID);
  if (!dataEl) throw new Error('This page has no #archive-data slot, so it can’t save itself.');
  dataEl.textContent = encodeData(docs);
  return '<!doctype html>\n' + html.outerHTML + '\n';
}

// ---------- capability checks ----------

export function canUseFilePickers() {
  return typeof window !== 'undefined' && 'showSaveFilePicker' in window && window.isSecureContext;
}

// ---------- file handle persistence (IndexedDB) ----------
const IDB_NAME = 'thetree';
const IDB_STORE = 'handles';
const HANDLE_KEY = 'archive-file';

function openIdb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbSet(key, val) {
  return openIdb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGet(key) {
  return openIdb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  }));
}
export function getSavedFileHandle() { return idbGet(HANDLE_KEY).catch(() => null); }
export function rememberFileHandle(h) { return idbSet(HANDLE_KEY, h); }
export function forgetFileHandle() { return idbSet(HANDLE_KEY, undefined); }

// Re-grant read/write on a stored handle. Must run inside a user gesture if it
// needs to prompt. Returns true only when access is granted.
export async function verifyPermission(handle, write = true) {
  if (!handle) return false;
  const opts = { mode: write ? 'readwrite' : 'read' };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
  } catch { /* handle from a previous session may be unusable — treat as no access */ }
  return false;
}

// ---------- open / reconnect to a family.html on disk ----------

// Open a family.html the user chooses. Uses the File System Access picker where
// available (so later saves can write in place), falling back to a plain file input
// (read-only; saves become downloads) on Safari/Firefox. Returns {handle, name,
// docs} — handle is null on the fallback path. Resolves null if the user cancels.
export async function openArchiveFile() {
  if (canUseFilePickers()) {
    let handle;
    try {
      [handle] = await window.showOpenFilePicker({
        id: 'thetree-archive',
        types: [{ description: 'Family archive', accept: { 'text/html': ['.html', '.htm'] } }],
        multiple: false,
      });
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      throw e;
    }
    const docs = extractDocsFromHTML(await (await handle.getFile()).text());
    await rememberFileHandle(handle);
    return { handle, name: handle.name, docs };
  }
  return openArchiveViaInput();
}

function openArchiveViaInput() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.html,.htm,text/html';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) { resolve(null); return; }
      try { resolve({ handle: null, name: file.name, docs: extractDocsFromHTML(await file.text()) }); }
      catch (e) { reject(e); }
    };
    // If the dialog is dismissed with no choice, no change event fires — that's fine,
    // the promise simply never resolves and the caller's flow ends quietly.
    input.click();
  });
}

// Re-read the data from a previously connected file handle (the returning-user path).
export async function readArchiveFromHandle(handle) {
  return extractDocsFromHTML(await (await handle.getFile()).text());
}

// ---------- save ----------

async function writeHandle(handle, text) {
  const w = await handle.createWritable();
  await w.write(text);
  await w.close();
}

export function downloadArchive(docs, filename = ARCHIVE_FILENAME) {
  const blob = new Blob([buildArchiveHTML(docs)], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Ask the user where family.html should live, and remember it for one-click saves.
export async function pickSaveLocation(suggestedName = ARCHIVE_FILENAME) {
  const handle = await window.showSaveFilePicker({
    id: 'thetree-archive',
    suggestedName,
    types: [{ description: 'Family archive', accept: { 'text/html': ['.html'] } }],
  });
  await rememberFileHandle(handle);
  return handle;
}

// Save the whole archive. With a writable handle (hosted editor, secure context)
// this overwrites the one file in place. Otherwise it downloads a fresh copy the
// user keeps (standalone file://, Safari). Returns { method, name }.
export async function saveArchive(docs, { handle } = {}) {
  const html = buildArchiveHTML(docs);
  if (handle && (await verifyPermission(handle))) {
    await writeHandle(handle, html);
    return { method: 'inplace', name: handle.name };
  }
  downloadArchive(docs);
  return { method: 'download', name: ARCHIVE_FILENAME };
}

// ---------- photos → compressed data URIs ----------
const MAX_DIM = 1600;       // longest edge, px
const JPEG_QUALITY = 0.8;

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('Could not read that file.'));
    fr.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('That image couldn’t be decoded in the browser.'));
    img.src = src;
  });
}

// Resize (longest edge ≤ MAX_DIM) and re-encode as JPEG, returning a data URI to
// store directly on the person. Keeps the one file modest — "wisdom, not a
// scrapbook." HEIC still can't decode in a canvas, so we reject it honestly.
export async function importPhoto(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'heic' || ext === 'heif') {
    throw new Error('HEIC/HEIF photos can’t be shown in the browser yet. In Photos, export a JPEG copy and add that instead.');
  }
  const img = await loadImage(await fileToDataURL(file));
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if (!w || !h) throw new Error('That image has no readable dimensions.');
  const longest = Math.max(w, h);
  if (longest > MAX_DIM) { const s = MAX_DIM / longest; w = Math.round(w * s); h = Math.round(h * s); }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // flatten any transparency for JPEG
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
}

</script>
<script type="text/plain" data-tt-mod="app/export.js">
// "Export Markdown" — the no-lock-in escape hatch. Emits the whole archive in the
// original plain-files layout (people/<id>-<slug>.md, unions/<id>-<type>.md) plus a
// short README, packed into one .zip with no dependencies. The Markdown is the
// durable, app-free record of names, dates, places, stories, and lessons; photos
// stay as data URIs inside family.html and are not copied here (their captions are).

import { store, slugify } from '@@MOD:app/store.js@@';
import { serializeDoc } from '@@MOD:app/parse.js@@';

function personFileName(data) {
  const name = (data.names && (data.names.display || data.names.given)) || data.id;
  return `people/${data.id}-${slugify(name)}.md`;
}
function unionFileName(data) {
  return `unions/${data.id}-${slugify(data.type || 'union')}.md`;
}

// Drop the heavy base64 photo data from frontmatter (it isn't meaningful as plain
// text); keep each photo's caption/date so the record still notes a picture existed.
function withoutPhotoData(data) {
  if (!data.photos || !data.photos.length) return data;
  const copy = JSON.parse(JSON.stringify(data));
  copy.photos = copy.photos.map((ph) => ({ caption: ph.caption || '', date: ph.date || '' }));
  return copy;
}

const README = `# A family archive, as plain files

These are the people and relationships from a family.html archive, written out as
plain Markdown: one file per person in \`people/\`, one per marriage or partnership
in \`unions/\`. Open any of them in a text editor; no app required, now or ever.

This is an export for safekeeping and for genealogy tools. The living, browsable
archive is the single \`family.html\` file these came from. Open that in a browser
to read the tree, timeline, map, and book, or to keep editing.
`;

function gatherFiles() {
  const files = [];
  for (const p of store.allPeople()) {
    files.push({ name: personFileName(p.data), text: serializeDoc(withoutPhotoData(p.data), p.body || '') });
  }
  for (const u of store.allUnions()) {
    files.push({ name: unionFileName(u.data), text: serializeDoc(u.data, u.body || '') });
  }
  files.push({ name: 'READ ME.md', text: README });
  return files;
}

// ---- minimal store-only ZIP (no compression, no dependencies) ----
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n += 1) {
    let c = n;
    for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i += 1) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

function zip(files) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);
    const local = [
      ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), // sig, version, flags, method (0 = store)
      ...u16(0), ...u16(0x21),                              // mod time, mod date (a fixed valid date)
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(nameBytes.length), ...u16(0),
    ];
    chunks.push(new Uint8Array(local), nameBytes, data);
    central.push({ nameBytes, crc, size: data.length, offset });
    offset += local.length + nameBytes.length + data.length;
  }
  const centralStart = offset;
  for (const c of central) {
    const cd = [
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0x21),
      ...u32(c.crc), ...u32(c.size), ...u32(c.size),
      ...u16(c.nameBytes.length), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(0),
      ...u32(c.offset),
    ];
    chunks.push(new Uint8Array(cd), c.nameBytes);
    offset += cd.length + c.nameBytes.length;
  }
  const eocd = [
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length),
    ...u32(offset - centralStart), ...u32(centralStart), ...u16(0),
  ];
  chunks.push(new Uint8Array(eocd));
  return new Blob(chunks, { type: 'application/zip' });
}

export function downloadMarkdownZip(basename = 'family') {
  const url = URL.createObjectURL(zip(gatherFiles()));
  const a = document.createElement('a');
  a.href = url;
  a.download = `the-${String(basename).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'family'}-family-markdown.zip`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

</script>
<script type="text/plain" data-tt-mod="app/gedcom.js">
// GEDCOM 5.5.1 export. Our model maps almost 1:1: each person -> INDI, each
// union -> FAM (HUSB/WIFE/CHIL, MARR, DIV). Partial dates convert to GEDCOM date
// phrases (ABT/BEF/AFT), stored coordinates become PLAC/MAP/LATI/LONG, and
// adopted/step children carry a PEDI tag — so the archive opens cleanly in any
// genealogy program. This is the payoff for modelling relationships GEDCOM-style.

import { store, displayName } from '@@MOD:app/store.js@@';

const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const esc = (s) => String(s == null ? '' : s).replace(/\r/g, '').replace(/@/g, '@@');

function gedDate(parsed) {
  if (!parsed || parsed.living) return null;
  if (parsed.known) {
    let core;
    if (parsed.precision === 'day') core = `${parsed.day} ${MON[parsed.month - 1]} ${parsed.year}`;
    else if (parsed.precision === 'month') core = `${MON[parsed.month - 1]} ${parsed.year}`;
    else core = `${parsed.year}`;
    const q = parsed.qualifier === 'about' ? 'ABT ' : parsed.qualifier === 'before' ? 'BEF ' : parsed.qualifier === 'after' ? 'AFT ' : '';
    return q + core;
  }
  return parsed.raw ? `(${esc(parsed.raw)})` : null; // freeform date phrase
}

function eventBlock(out, tag, parsedDate, place) {
  const date = gedDate(parsedDate);
  const lat = place && isFinite(+place.lat) ? +place.lat : null;
  const lng = place && isFinite(+place.lng) ? +place.lng : null;
  const placeName = place && place.place;
  if (!date && !placeName) return;
  out.push(`1 ${tag}`);
  if (date) out.push(`2 DATE ${date}`);
  if (placeName) {
    out.push(`2 PLAC ${esc(placeName)}`);
    if (lat != null && lng != null) {
      out.push('3 MAP');
      out.push(`4 LATI ${lat >= 0 ? 'N' : 'S'}${Math.abs(lat)}`);
      out.push(`4 LONG ${lng >= 0 ? 'E' : 'W'}${Math.abs(lng)}`);
    }
  }
}

function nameLines(out, p) {
  const n = p.data.names || {};
  const given = n.given || '';
  const surname = n.family || '';
  if (given || surname) {
    out.push(`1 NAME ${esc(given)} /${esc(surname)}/`.replace(/\s+\//, ' /'));
    if (given) out.push(`2 GIVN ${esc(given)}`);
    if (surname) out.push(`2 SURN ${esc(surname)}`);
  } else {
    out.push(`1 NAME ${esc(n.display || displayName(p))}`);
  }
  const aka = n.also_known_as || [];
  if (aka.length) out.push(`2 NICK ${esc(aka.join(', '))}`);
  if (n.maiden) out.push(`2 _MARNM ${esc(n.maiden)}`);
}

function noteLines(out, text) {
  const parts = String(text).replace(/\r/g, '').split('\n');
  parts.forEach((line, i) => out.push(`${i === 0 ? '1 NOTE' : '2 CONT'} ${esc(line)}`));
}

export function buildGedcom() {
  const people = store.allPeople();
  const unions = store.allUnions();
  const indi = new Map(); people.forEach((p, i) => indi.set(p.id, `@I${i + 1}@`));
  const fam = new Map(); unions.forEach((u, i) => fam.set(u.id, `@F${i + 1}@`));

  const out = [];
  const today = new Date();
  out.push('0 HEAD');
  out.push('1 SOUR TheTree');
  out.push('2 NAME The Tree');
  out.push('1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED');
  out.push('1 CHAR UTF-8');
  out.push(`1 DATE ${today.getDate()} ${MON[today.getMonth()]} ${today.getFullYear()}`);

  for (const p of people) {
    out.push(`0 ${indi.get(p.id)} INDI`);
    nameLines(out, p);
    if (p.data.sex === 'M' || p.data.sex === 'F') out.push(`1 SEX ${p.data.sex}`);
    eventBlock(out, 'BIRT', p.birth, p.data.birth);
    eventBlock(out, 'DEAT', p.death, p.data.death);

    // FAMC (the union this person was born/adopted into) with pedigree
    const pu = p.data.parents_union;
    if (pu && fam.has(pu)) {
      out.push(`1 FAMC ${fam.get(pu)}`);
      const u = store.getUnion(pu);
      const entry = u && (u.data.children || []).find((c) => c.person === p.id);
      const rel = entry && entry.relation;
      if (rel === 'adopted') out.push('2 PEDI adopted');
      else if (rel === 'biological') out.push('2 PEDI birth');
      else if (rel === 'step') out.push('2 PEDI foster'); // closest standard 5.5.1 value
    }
    // FAMS (unions this person is a partner in)
    for (const uid of p.data.unions || []) if (fam.has(uid)) out.push(`1 FAMS ${fam.get(uid)}`);

    const body = (p.body || '').trim();
    if (body) noteLines(out, body);
  }

  for (const u of unions) {
    out.push(`0 ${fam.get(u.id)} FAM`);
    const parts = (u.data.partners || []).map((id) => store.getPerson(id)).filter(Boolean);
    // Prefer M->HUSB, F->WIFE; otherwise keep the recorded order.
    let husb = parts.find((p) => p.data.sex === 'M');
    let wife = parts.find((p) => p.data.sex === 'F');
    if (!husb || !wife || husb === wife) { husb = parts[0]; wife = parts[1]; }
    if (husb) out.push(`1 HUSB ${indi.get(husb.id)}`);
    if (wife && wife !== husb) out.push(`1 WIFE ${indi.get(wife.id)}`);

    const marrDate = gedDate(u.start);
    if (marrDate || u.data.type) {
      out.push('1 MARR');
      if (marrDate) out.push(`2 DATE ${marrDate}`);
      if (u.data.type && u.data.type !== 'marriage') out.push(`2 TYPE ${esc(u.data.type)}`);
    }
    if (u.data.status === 'divorced' || u.data.status === 'separated' || u.data.status === 'ended') {
      out.push('1 DIV');
      const endDate = gedDate(u.end);
      if (endDate) out.push(`2 DATE ${endDate}`);
    }
    for (const c of u.data.children || []) if (indi.has(c.person)) out.push(`1 CHIL ${indi.get(c.person)}`);
    const notes = (u.body || '').trim();
    if (notes) noteLines(out, notes);
  }

  out.push('0 TRLR');
  return out.join('\n') + '\n';
}

export function downloadGedcom(basename = 'family') {
  const text = buildGedcom();
  const blob = new Blob([text], { type: 'text/vnd.familysearch.gedcom;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `the-${String(basename).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'family'}-family.ged`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

</script>
<script type="text/plain" data-tt-mod="app/views/edit.js">
// Person editor: core facts, story, family links, and optional details.
// Fields are grouped into a short Identity stack the user sees first, then
// Dates & Places, Story, Family — with Tags + Photos tucked into "Optional
// details" so a first-time add is just name → maybe a date → maybe a story.
// Writes plain files when an archive folder is connected; in demo mode it
// updates the in-memory store only (and a toast reminds the user).

import { el, clear, toast } from '@@MOD:app/dom.js@@';
import { store, displayName, uid, THEMES } from '@@MOD:app/store.js@@';
import { importPhoto } from '@@MOD:app/archive.js@@';
import { app } from '@@MOD:app/context.js@@';
import { lookupPlace, parseLatLng } from '@@MOD:app/geo.js@@';

const STORY_PROMPTS = [
  'What were they known for?',
  'A decision they made that you admire',
  'What did money teach them?',
  'A talent, skill, or trade',
  'How did they handle a hard time?',
  'What would they want you to remember?',
];

function commaList(s) { return String(s || '').split(',').map((x) => x.trim()).filter(Boolean); }

export function openPersonEditor({ person }) {
  document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
  const isNew = !person;
  const data = person ? JSON.parse(JSON.stringify(person.data)) : { id: uid('p'), unions: [], parents_union: null };
  const names = data.names || (data.names = {});
  const body0 = person ? person.body : '';

  const f = {}; // field refs
  const row = (label, input, hint, required) => el('div', { class: 'form-row' },
    el('label', {}, label, required ? el('span', { class: 'req' }, '*') : null),
    input,
    hint ? el('div', { class: 'hint' }, hint) : null);

  // --- Identity ---
  f.display = el('input', { type: 'text', value: names.display || '', placeholder: 'e.g. Wong Ah-fook', autocomplete: 'off' });
  f.given = el('input', { type: 'text', value: names.given || '', autocomplete: 'off' });
  f.family = el('input', { type: 'text', value: names.family || '', autocomplete: 'off' });
  f.sex = el('select', {}, ...['', 'F', 'M', 'other'].map((v) =>
    el('option', { value: v, selected: (data.sex || '') === v || undefined }, v ? ({F:'Female', M:'Male', other:'Other'})[v] : 'Unspecified')));

  // --- Dates & places ---
  f.birth = el('input', { type: 'text', value: (data.birth && data.birth.date) || '', placeholder: 'e.g. 1938-04-12, 1938, or “abt 1850”' });
  f.birthPlace = el('input', { type: 'text', value: (data.birth && data.birth.place) || '', placeholder: 'e.g. Taishan, Guangdong' });
  f.death = el('input', { type: 'text', value: (data.death && data.death.date) || '', placeholder: 'leave blank if living' });
  f.deathPlace = el('input', { type: 'text', value: (data.death && data.death.place) || '' });
  const birthGeo = makeGeo(f.birthPlace, data.birth);
  const deathGeo = makeGeo(f.deathPlace, data.death);
  f.living = el('input', { type: 'checkbox' }); f.living.checked = data.living === true;

  // --- Story ---
  f.story = el('textarea', {
    placeholder: 'A few sentences are enough. Add lessons inline with {lesson: theme} … or {mistake: theme} …, or use the composer below.',
  }, body0);

  // lesson composer: structured inputs that splice a well-formed marker into the story
  const knownThemes = collectThemes();
  const composerKind = el('select', {}, ...['lesson', 'mistake'].map((k) => el('option', { value: k }, k)));
  const composerTheme = el('select', {}, ...knownThemes.map((t) => el('option', { value: t }, t)), el('option', { value: '__custom' }, 'other…'));
  const composerCustom = el('input', { type: 'text', placeholder: 'theme (one word)', style: { display: 'none' } });
  composerTheme.addEventListener('change', () => {
    composerCustom.style.display = composerTheme.value === '__custom' ? '' : 'none';
    if (composerTheme.value === '__custom') composerCustom.focus();
  });
  const composerInsert = el('button', { type: 'button', class: 'btn btn-small btn-primary', onclick: () => {
    const theme = (composerTheme.value === '__custom' ? composerCustom.value : composerTheme.value).trim().toLowerCase();
    if (!theme) { toast('Pick a theme first.', { kind: 'error' }); return; }
    const safe = theme.replace(/[^a-z0-9-]/g, '');
    insert(f.story, `\n\n- {${composerKind.value}: ${safe}} `);
  } }, 'Add to story');
  const composer = el('div', { class: 'lesson-composer' },
    el('span', { class: 'lesson-composer-label' }, 'Lesson composer'),
    composerKind, composerTheme, composerCustom, composerInsert);

  const promptBar = el('div', { class: 'prompt-library' },
    ...STORY_PROMPTS.map((q) => el('button', { type: 'button', class: 'prompt-chip', onclick: () => insert(f.story, `\n\n**${q}**\n`) }, q)));

  // --- Family ---
  const unionOptions = [el('option', { value: '' }, 'Unknown / not recorded'),
    ...store.allUnions().map((u) => el('option', { value: u.id, selected: data.parents_union === u.id || undefined }, unionLabel(u)))];
  f.parents = el('select', {}, ...unionOptions);
  const curRel = parentsRelation(person);
  f.relation = el('select', {}, ...['biological', 'adopted', 'step'].map((v) => el('option', { value: v, selected: curRel === v || undefined }, v)));
  const relationRow = row('Relation to parents', f.relation);
  // hide relation until a parents union is chosen — otherwise it's "biological to nobody"
  const updateRelationVisibility = () => { relationRow.style.display = f.parents.value ? '' : 'none'; };
  f.parents.addEventListener('change', updateRelationVisibility);
  f.spouse = el('select', {}, el('option', { value: '' }, 'None'),
    ...store.allPeople().filter((p) => p.id !== data.id).sort((a, b) => displayName(a).localeCompare(displayName(b)))
      .map((p) => el('option', { value: p.id }, displayName(p))));

  // --- Optional details (collapsed) ---
  f.maiden = el('input', { type: 'text', value: names.maiden || '', autocomplete: 'off' });
  f.aka = el('input', { type: 'text', value: (names.also_known_as || []).join(', '), placeholder: 'nicknames, comma-separated', autocomplete: 'off' });
  f.talent = el('input', { type: 'text', value: ((data.tags && data.tags.talent) || []).join(', '), placeholder: 'running, painting…' });
  f.health = el('input', { type: 'text', value: ((data.tags && data.tags.health) || []).join(', '), placeholder: 'heart-disease…' });

  // photos (archive only)
  const photoStatus = el('div', { class: 'hint' });
  const photoInput = el('input', { type: 'file', accept: 'image/*', multiple: true, onchange: (e) => addPhotos(e.target.files) });
  data.photos = data.photos || [];
  async function addPhotos(files) {
    for (const file of files) {
      try {
        const src = await importPhoto(file);
        data.photos.push({ src, caption: '', date: '' });
        photoStatus.textContent = `Added ${data.photos.length} photo${data.photos.length === 1 ? '' : 's'}, shrunk to fit and tucked into the file.`;
      } catch (err) {
        toast(err.message, { kind: 'error' });
        photoStatus.textContent = err.message;
      }
    }
  }

  const err = el('div', { class: 'hint', style: { color: 'var(--oxblood)', marginTop: 'var(--s-3)' } });

  // Apply the form to the in-memory store, then hand off to main.js to persist the
  // whole archive (write family.html in place, or download a fresh copy). The store
  // mutation can't half-apply to disk anymore — there is no disk write here — so the
  // failure modes that needed an up-front permission check and heal-from-disk are
  // gone. A failed file write is handled centrally in main.js, where the in-memory
  // edit is kept (never lost) and the user is offered Reconnect / Download.
  function save() {
    err.textContent = '';
    const display = f.display.value.trim();
    if (!display && !f.given.value.trim()) {
      err.textContent = 'A name is required: at least a given name or a full name.';
      f.display.focus();
      return;
    }
    names.display = display || [f.given.value, f.family.value].filter(Boolean).join(' ').trim();
    names.given = f.given.value.trim() || undefined;
    names.family = f.family.value.trim() || undefined;
    names.maiden = f.maiden.value.trim() || undefined;
    const aka = commaList(f.aka.value); names.also_known_as = aka.length ? aka : undefined;
    data.sex = f.sex.value || undefined;
    data.birth = withCoords(clean({ date: f.birth.value.trim(), place: f.birthPlace.value.trim() }), birthGeo);
    data.death = withCoords(clean({ date: f.death.value.trim(), place: f.deathPlace.value.trim() }), deathGeo);
    data.living = f.living.checked || undefined;
    const tags = data.tags || {};
    setTag(tags, 'talent', commaList(f.talent.value));
    setTag(tags, 'health', commaList(f.health.value));
    data.tags = Object.keys(tags).length ? tags : undefined;
    const body = f.story.value.trim();

    try {
      persistPerson(data, body);
      applyParents(data, f.parents.value || null, f.relation.value);
      if (f.spouse.value) applySpouse(data, f.spouse.value);
    } catch (e) {
      console.error('The Tree: edit failed', e); // never swallow the only diagnostic
      err.textContent = 'Couldn’t apply that edit: ' + ((e && e.message) || String(e));
      return;
    }
    close();
    // main.js re-renders and persists the archive (and reports saved / downloaded / not-yet-saved).
    window.dispatchEvent(new CustomEvent('data:changed', { detail: { focus: data.id, persist: true } }));
    toast(isNew ? `Added ${names.display}.` : `Saved ${names.display}.`, { kind: 'success' });
  }

  const backdrop = el('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target === backdrop) close(); } });
  function close() { backdrop.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);

  const identitySection = el('div', { class: 'form-section' },
    el('div', { class: 'form-section-head' }, 'Identity'),
    row('Full name', f.display, null, true),
    el('div', { class: 'form-grid' },
      row('Given', f.given),
      row('Family', f.family),
      row('Sex', f.sex),
      row('Still living?', el('span', { class: 'inline-check' }, f.living, el('span', { class: 'inline-check-label' }, 'Yes, currently living')))),
  );

  const datesSection = el('div', { class: 'form-section' },
    el('div', { class: 'form-section-head' }, 'Dates & places'),
    el('div', { class: 'form-grid' },
      row('Born', f.birth, 'Any precision works. A year alone is enough.'),
      row('Birthplace', el('div', {}, f.birthPlace, birthGeo.wrap), 'Coordinates fill in offline.'),
      row('Died', f.death),
      row('Place of death', el('div', {}, f.deathPlace, deathGeo.wrap))),
  );

  const storySection = el('div', { class: 'form-section' },
    el('div', { class: 'form-section-head' }, 'Story'),
    row('Their story', el('div', {}, f.story, composer, promptBar),
      el('span', {}, 'Markers like ', el('code', {}, '{lesson: money}'), ' or ', el('code', {}, '{mistake: health}'), ' collect into the Lessons view.')),
  );

  const familySection = el('div', { class: 'form-section' },
    el('div', { class: 'form-section-head' }, 'Family'),
    row('Parents', f.parents, 'Pick the union the person belongs to. New unions can be added by editing one of the parents.'),
    relationRow,
    row('Add a spouse / partner', f.spouse, 'Creates a marriage link to the chosen person.'),
  );

  const optionalSection = el('details', { class: 'collapse' },
    el('summary', {}, 'Optional details: nicknames, traits, photos'),
    el('div', { class: 'collapse-body' },
      el('div', { class: 'form-grid' }, row('Former / maiden name', f.maiden), row('Also known as', f.aka)),
      el('div', { class: 'form-grid' }, row('Talents', f.talent, 'Comma-separated.'), row('Health notes', f.health, 'Comma-separated.')),
      row('Add photos', el('div', {}, photoInput, photoStatus), 'JPEG / PNG / GIF / WebP, shrunk to fit and stored inside the file. HEIC isn’t browser-viewable.'),
    ));

  backdrop.append(el('div', { class: 'modal' },
    el('h2', {}, isNew ? 'Add a person' : `Edit ${displayName(person)}`),
    el('p', { class: 'modal-sub' }, isNew
      ? 'A name is all that’s required. You can come back and fill in the rest.'
      : `Editing ${displayName(person)}. Changes ${app.mode === 'archive' ? 'save to your family.html.' : 'live only in this demo tab.'}`),
    identitySection,
    datesSection,
    storySection,
    familySection,
    optionalSection,
    err,
    el('div', { class: 'form-actions' },
      el('button', { class: 'btn btn-ghost', onclick: close }, 'Cancel'),
      el('button', { class: 'btn btn-primary', onclick: save }, isNew ? 'Add person' : 'Save')),
  ));
  document.body.append(backdrop);
  updateRelationVisibility();
  f.display.focus();
}

// ---- persistence helpers (mutate the in-memory store; main.js writes the file) ----
function persistPerson(data, body) {
  store.upsertPerson({ data, body });
}
function persistUnion(u) {
  store.upsertUnion({ data: u.data, body: u.body || '' });
}

function applyParents(data, newPU, relation) {
  const oldPU = store.getPerson(data.id) ? store.getPerson(data.id).data.parents_union : null;
  // remove from old union's children if it changed
  if (oldPU && oldPU !== newPU) {
    const ou = store.getUnion(oldPU);
    if (ou) { ou.data.children = (ou.data.children || []).filter((c) => c.person !== data.id); persistUnion(ou); }
  }
  data.parents_union = newPU || null;
  if (newPU) {
    const u = store.getUnion(newPU);
    if (u) {
      const kids = u.data.children || (u.data.children = []);
      const entry = kids.find((c) => c.person === data.id);
      if (entry) entry.relation = relation; else kids.push({ person: data.id, relation });
      persistUnion(u);
    }
  }
  persistPerson(data, store.getPerson(data.id) ? store.getPerson(data.id).body : '');
}

function applySpouse(data, spouseId) {
  const exists = store.allUnions().find((u) => (u.data.partners || []).includes(data.id) && (u.data.partners || []).includes(spouseId));
  if (exists) return;
  const u = { data: { id: uid('u'), type: 'marriage', partners: [data.id, spouseId], status: 'married', children: [] }, body: '' };
  persistUnion(u);
  for (const pid of [data.id, spouseId]) {
    const p = store.getPerson(pid);
    if (!p) continue;
    p.data.unions = [...new Set([...(p.data.unions || []), u.data.id])];
    persistPerson(p.data, p.body);
  }
}

// ---- small utilities ----
function insert(textarea, snippet) {
  const s = textarea.selectionStart ?? textarea.value.length;
  textarea.value = textarea.value.slice(0, s) + snippet + textarea.value.slice(s);
  textarea.focus();
  const pos = s + snippet.length;
  textarea.setSelectionRange(pos, pos);
}
function clean(obj) { const o = {}; for (const [k, v] of Object.entries(obj)) if (v) o[k] = v; return Object.keys(o).length ? o : undefined; }

function collectThemes() {
  const seen = new Set(THEMES);
  try {
    const groups = store.lessonsByTheme ? store.lessonsByTheme() : {};
    for (const k of Object.keys(groups || {})) seen.add(k);
  } catch {}
  return [...seen];
}

// A place field paired with an offline coordinate lookup. Typing a place and
// tabbing out resolves coordinates from the bundled gazetteer (no network); the
// user can also paste lat/lng by hand or click Locate to refresh.
function makeGeo(placeInput, existing) {
  const haveOld = existing && isFinite(+existing.lat) && isFinite(+existing.lng);
  const coords = el('input', { type: 'text', placeholder: 'lat, lng', value: haveOld ? `${existing.lat}, ${existing.lng}` : '' });
  const status = el('div', { class: 'coord-status' });
  const set = (msg, cls) => { status.textContent = msg; status.className = 'coord-status' + (cls ? ' ' + cls : ''); };
  async function locate(force) {
    const place = placeInput.value.trim();
    if (!place) { set(''); return; }
    if (!force && parseLatLng(coords.value)) return; // keep coords we already have
    set('Looking up…');
    try {
      const hit = await lookupPlace(place);
      if (hit) { coords.value = `${hit.lat}, ${hit.lng}`; set(`Found ${hit.label}${hit.country ? ', ' + hit.country : ''} (pinned offline).`, 'is-found'); }
      else set('Not in the gazetteer. Paste “lat, lng” from any map (right-click a spot → copy).', 'is-missing');
    } catch (e) { set('Lookup unavailable: ' + e.message, 'is-missing'); }
  }
  placeInput.addEventListener('blur', () => locate(false));
  coords.addEventListener('input', () => set(''));
  const wrap = el('div', {},
    el('div', { class: 'coord-row' }, coords, el('button', { type: 'button', class: 'btn btn-small', onclick: () => locate(true) }, 'Locate')),
    status);
  return { coords, wrap };
}

// Attach lat/lng from a geo field to a birth/death object (0 is a valid latitude,
// so we set the numbers explicitly rather than routing them through clean()).
function withCoords(obj, geo) {
  const c = parseLatLng(geo.coords.value);
  if (!c) return obj;
  const o = obj || {};
  o.lat = c.lat; o.lng = c.lng;
  return o;
}
function setTag(tags, key, arr) { if (arr.length) tags[key] = arr; else delete tags[key]; }
function unionLabel(u) {
  const names = (u.data.partners || []).map((id) => { const p = store.getPerson(id); return p ? displayName(p) : '?'; });
  return names.join(' & ') || u.id;
}
function parentsRelation(person) {
  if (!person || !person.data.parents_union) return 'biological';
  const u = store.getUnion(person.data.parents_union);
  const e = u && (u.data.children || []).find((c) => c.person === person.id);
  return (e && e.relation) || 'biological';
}

</script>
<script type="text/plain" data-tt-mod="app/views/guide.js">
